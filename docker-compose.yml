version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/app/chroma_db
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-llama-3.3-70b-versatile}
      - GROQ_WHISPER_MODEL=${GROQ_WHISPER_MODEL:-whisper-large-v3}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - CHROMA_DB_PATH=/app/chroma_db
    networks:
      - aura-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aura-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aura-network

volumes:
  chroma-data:
    driver: local

networks:
  aura-network:
    driver: bridge
