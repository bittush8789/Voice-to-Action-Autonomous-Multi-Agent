name: Build, Verify and Deploy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Dry-Run App Startup Check
        env:
          GROQ_API_KEY: "mock_key_for_testing"
        run: |
          python -c "import backend.app; print('FastAPI Backend imports successfully!')"

  build-and-verify:
    name: Container Build & Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: bittush8789/aura-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: bittush8789/aura-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-k8s:
    name: Validate Kubernetes Manifests
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Kubernetes CLI (kubectl)
        uses: azure/setup-kubectl@v3

      - name: Dry-Run Manifest Validation
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/configmap.yaml
          kubectl apply --dry-run=client -f k8s/secrets.yaml
          kubectl apply --dry-run=client -f k8s/pvc.yaml
          kubectl apply --dry-run=client -f k8s/backend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/backend-service.yaml
          kubectl apply --dry-run=client -f k8s/frontend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/frontend-service.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
